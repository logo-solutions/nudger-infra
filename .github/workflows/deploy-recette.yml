name: Deploy XWiki to Recette

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: write  # Permet l'écriture sur le contenu du repository
  pull-requests: write  # Permet l'écriture sur les PR (utile pour les merges ou la gestion des PR)
  actions: read  # Permet la lecture des actions et de leurs logs

jobs:
  deploy-recette:
    runs-on: ubuntu-latest

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Configure kubectl
        env:
          KUBECONFIG_CONTENTS: ${{ secrets.KUBECONFIG_CONTENTS }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_CONTENTS" > ~/.kube/config

      - name: 🧩 Run deployment script
        run: |
          chmod +x scripts/ci-cd/deploy-xwiki.sh
          ./scripts/ci-cd/deploy-xwiki.sh recette

