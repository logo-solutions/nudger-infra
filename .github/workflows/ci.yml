name: CI Workflow

on: 
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - deploy

jobs:
  build:
    runs-on: self-hosted  # Ce job sera exécuté sur ton runner auto-hébergé
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run a simple script
        run: echo "Hello from self-hosted runner!"
