apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: secret-tls-dashboard
  namespace: kubernetes-dashboard
spec:
  secretName: secret-tls-dashboard
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  commonName: dashboard.nudger.logo-solutions.fr
  dnsNames:
    - 'dashboard.nudger.logo-solutions.fr'
  duration: 2160h
  renewBefore: 360h
