# HARDENING PROMETHEUS

server:
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

# -----------------------------------------------------------------------------
# KUBE STATE METRICS (correct key: kube-state-metrics)
# -----------------------------------------------------------------------------
kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# -----------------------------------------------------------------------------
# NODE EXPORTER (required for NSA)
# -----------------------------------------------------------------------------
prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# -----------------------------------------------------------------------------
# CONFIGMAP RELOAD (part of server)
# -----------------------------------------------------------------------------
serverFiles:
  alerting_rules.yml: {}
  recording_rules.yml: {}

configmapReload:
  prometheus:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]

# -----------------------------------------------------------------------------
# PUSHGATEWAY (disabled but chart still creates object → SECURE IT TOO)
# -----------------------------------------------------------------------------
pushgateway:
  enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# -----------------------------------------------------------------------------
# ALERTMANAGER
# -----------------------------------------------------------------------------
alertmanager:
  enabled: false
